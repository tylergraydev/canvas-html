<!doctype html>
<html>
  <head><meta charset="utf-8" /></head>
  <body style="font:24px sans-serif; padding:24px; background:#111; color:#eee;">
    <h1 id="result">probing…</h1>
    <pre id="detail"></pre>
    <script>
      const proto = CanvasRenderingContext2D.prototype;
      const has = (name) => typeof proto[name] === 'function';
      const result = {
        ua: navigator.userAgent,
        drawElementImage: has('drawElementImage'),
        drawElement: has('drawElement'),
        reset: has('reset'),
      };
      document.getElementById('result').textContent =
        result.drawElementImage
          ? '✅ drawElementImage AVAILABLE'
          : '❌ drawElementImage MISSING';
      document.getElementById('detail').textContent = JSON.stringify(result, null, 2);
    </script>
  </body>
</html>
